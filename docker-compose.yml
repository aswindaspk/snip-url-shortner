
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    command: npm run dev

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/snip-db
      REDIS_URL: redis://redis:6379
      PORT: 3000

    env_file:
      - .env

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command: npm run dev:worker

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/snip-db
      REDIS_URL: redis://redis:6379

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snip-db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snip-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
